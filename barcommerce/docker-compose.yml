version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: barcommerce-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: barcommerce-ml
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
