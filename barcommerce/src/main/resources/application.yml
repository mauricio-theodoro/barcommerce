server:
  port: 8080

spring:
  application:
    name: BarCommerce

  datasource:
    url: jdbc:mariadb://localhost:3306/barcommerce
    username: root
    password:
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    date-format: yyyy-MM-dd
    time-zone: UTC

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true